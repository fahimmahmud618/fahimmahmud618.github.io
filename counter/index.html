
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Item Counter</title>

  <!-- html2canvas for saving the counter as an image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f4f5f7;
  color: #171717;
  padding: 24px 14px;
}

.container {
  max-width: 480px;
  margin: auto;
  background: #ffffff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
}

h1 {
  font-size: 22px;
  font-weight: 650;
  text-align: center;
  margin-bottom: 20px;
}


/* =========================
   DATE
========================= */

.date-section {
  margin-bottom: 18px;
}

.date-section label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #666;
  margin-bottom: 6px;
}

.date-section input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  font-size: 14px;
  color: #222;
  background: #f8f8f8;
  border: 1px solid #e5e5e5;
  border-radius: 9px;
  outline: none;
}

.date-section input:focus {
  border-color: #999;
}


/* =========================
   COUNTER LIST
========================= */

.counter-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}


/* Individual item */

.counter-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

  min-height: 48px;

  padding: 6px 8px 6px 13px;

  background: #fafafa;
  border: 1px solid #eeeeee;
  border-radius: 10px;
}


/* Item name */

.item-name {
  font-size: 14px;
  font-weight: 500;

  /* Prevent very long names from stretching the row */
  max-width: 55%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* =========================
   CONTROLS
========================= */

.controls {
  display: flex;
  align-items: center;
  gap: 5px;
}


/* Buttons */

.controls button {
  width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 8px;

  font-size: 18px;
  line-height: 1;

  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.1s ease;
}


/* Minus */

.minus {
  background: #f0f0f0;
  color: #555;
}

.minus:hover {
  background: #e5e5e5;
}


/* Plus */

.plus {
  background: #171717;
  color: #ffffff;
}

.plus:hover {
  background: #333;
}


/* Click effect */

.controls button:active {
  transform: scale(0.94);
}


/* Count */

.count {
  width: 28px;

  text-align: center;

  font-size: 14px;
  font-weight: 600;
  color: #222;
}


/* =========================
   ADD ITEM
========================= */

.add-section {
  margin-top: 18px;
  padding-top: 16px;

  border-top: 1px solid #eeeeee;
}

.add-section label {
  display: block;

  font-size: 13px;
  font-weight: 600;
  color: #666;

  margin-bottom: 6px;
}

.add-section select {
  width: 100%;
  height: 42px;

  padding: 0 12px;

  font-size: 14px;

  color: #333;
  background: #fafafa;

  border: 1px solid #e5e5e5;
  border-radius: 9px;

  outline: none;
  cursor: pointer;
}

.add-section select:focus {
  border-color: #999;
}


/* =========================
   SAVE BUTTON
========================= */

.save-section {
  max-width: 480px;
  margin: 12px auto 0;
}

.save-button {
  width: 100%;
  height: 44px;

  border: none;
  border-radius: 10px;

  background: #171717;
  color: white;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition: background 0.15s ease;
}

.save-button:hover {
  background: #333;
}

.save-button:active {
  transform: scale(0.99);
}

.save-button:disabled {
  background: #aaa;
  cursor: wait;
}

/* ========================= COUNTER LAYOUT ========================= */ 
.counter-layout {
  display: grid;
  grid-template-columns: 7fr 3fr;
  gap: 10px;
  align-items: start;
}

/* ========================= PACKAGING ========================= */ .packaging-section { background: #fafafa; border: 1px solid #eeeeee; border-radius: 10px; padding: 10px; } .packaging-title { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 8px; } .packaging-list { display: flex; flex-direction: column; gap: 6px; } .packaging-item { display: flex; align-items: center; justify-content: space-between; min-height: 36px; padding: 3px 4px 3px 7px; background: #fff; border: 1px solid #eeeeee; border-radius: 7px; } .packaging-item > span { font-size: 13px; font-weight: 600; } .packaging-controls { display: flex; align-items: center; gap: 3px; } .packaging-controls button { width: 24px; height: 24px; border: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; } .pack-minus { background: #f0f0f0; color: #555; } .pack-plus { background: #171717; color: white; } .pack-count { width: 20px; text-align: center; font-size: 12px; } /* Small phone adjustment */ 
@media (max-width: 380px) {
  .counter-layout {
    grid-template-columns: 7fr 3fr;
    gap: 7px;
  }

  .packaging-section {
    padding: 7px;
  }

  .packaging-controls {
    gap: 2px;
  }

  .packaging-controls button {
    width: 21px;
    height: 21px;
    font-size: 13px;
  }

  .pack-count {
    width: 17px;
    font-size: 11px;
  }
}


/* =========================
   COMMENT / ADDITIONAL ITEM
========================= */

.comment-section {
  margin-top: 14px;
}

.comment-section label {
  display: block;

  font-size: 13px;
  font-weight: 600;

  color: #666;

  margin-bottom: 6px;
}

.comment-section textarea {
  width: 100%;

  min-height: 70px;

  padding: 10px 12px;

  font-family: inherit;
  font-size: 14px;
  line-height: 1.4;

  color: #222;
  background: #fafafa;

  border: 1px solid #e5e5e5;
  border-radius: 9px;

  outline: none;

  resize: vertical;

  transition: border-color 0.15s ease;
}

.comment-section textarea:focus {
  border-color: #999;
}

.comment-section textarea::placeholder {
  color: #aaa;
}

#saveRecordButton {
  background: #2563eb;
}

#saveRecordButton:hover {
  background: #1d4ed8;
}


.new-item-section {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid #eeeeee;
}

.new-item-section h3 {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
}

.new-item-section input,
.new-item-section select {
  width: 100%;
  height: 42px;
  margin-bottom: 7px;

  padding: 0 12px;

  font-size: 14px;

  background: #fafafa;

  border: 1px solid #e5e5e5;
  border-radius: 9px;

  outline: none;
}

.new-item-section button {
  width: 100%;
  height: 42px;

  border: none;
  border-radius: 9px;

  background: #16a34a;
  color: white;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
}

.new-item-section button:hover {
  background: #15803d;
}

.new-item-section button:disabled {
  background: #aaa;
  cursor: wait;
}
  </style>
</head>

<body>

  <!-- Everything inside this container will be saved as an image -->
  <div class="container" id="result">

    <h1>Mehwish Product Counter</h1>

    <!-- DATE -->
    <div class="date-section">
      <label for="datePicker">Date</label>

      <input
        type="date"
        id="datePicker"
      >
    </div>


    <!-- COUNTERS -->
    <div class="counter-layout">

      <!-- ITEM COUNTER -->
      <div class="item-counter-section">

        <div
          id="counterList"
          class="counter-list"
        ></div>

      </div>


      <!-- PACKAGING COUNTER -->
      <div class="packaging-section">

        <div class="packaging-title">
          Packaging
        </div>

        <div class="packaging-list">

          <div class="packaging-item">
            <span>S</span>

            <div class="packaging-controls">
              <button class="pack-minus">−</button>
              <strong class="pack-count">0</strong>
              <button class="pack-plus">+</button>
            </div>
          </div>


          <div class="packaging-item">
            <span>M</span>

            <div class="packaging-controls">
              <button class="pack-minus">−</button>
              <strong class="pack-count">0</strong>
              <button class="pack-plus">+</button>
            </div>
          </div>


          <div class="packaging-item">
            <span>L</span>

            <div class="packaging-controls">
              <button class="pack-minus">−</button>
              <strong class="pack-count">0</strong>
              <button class="pack-plus">+</button>
            </div>
          </div>


          <div class="packaging-item">
            <span>XL</span>

            <div class="packaging-controls">
              <button class="pack-minus">−</button>
              <strong class="pack-count">0</strong>
              <button class="pack-plus">+</button>
            </div>
          </div>

        </div>

      </div>

    </div>


    <!-- ADD UNPOPULAR ITEM -->
    <div
      class="add-section"
      id="addSection"
    >

      <label for="itemSelect">
        Add another item
      </label>

      <select id="itemSelect">

        <option value="">
          Select an item...
        </option>

      </select>

    </div>

    <!-- COMMENT / ADDITIONAL ITEM -->

<div class="comment-section">

  <label for="comment">
    Comment / Additional Item
  </label>

  <textarea
    id="comment"
    placeholder="Write a comment or add another item..."
    rows="3"
  ></textarea>

</div>


  </div>

  




  <!-- SAVE BUTTON -->
  <!-- Outside #result, so it won't appear in the image -->

  <div class="save-section">

    <button
      class="save-button"
      id="saveButton"
    >
      📷 Save as Image
    </button>

  </div>

  <div class="save-section">

  <button
    class="save-button"
    id="saveRecordButton"
  >
    💾 Save to Record
  </button>

</div>


<div class="new-item-section">

  <h3>Add New Product</h3>

  <input
    type="text"
    id="newItemId"
    placeholder="Item ID e.g. 0025"
  >

  <input
    type="text"
    id="newItemName"
    placeholder="Item name e.g. New Product"
  >

  <select id="newItemType">

    <option value="p">
      Popular
    </option>

    <option value="u">
      Unpopular
    </option>

  </select>

  <button
    type="button"
    id="addNewItemButton"
  >
    ＋ Add New Item
  </button>

</div>


<script>

  // =====================================================
  // GOOGLE APPS SCRIPT URL
  // =====================================================

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby8CZsCoIz7HnBEHI9KY041aXL0qyHf_dV2ZFVnrGYJwfRIsEzIfi__g3wOV9_AOZHY/exec";


  // =====================================================
  // DOM ELEMENTS
  // =====================================================

  const datePicker =
    document.getElementById("datePicker");

  const counterList =
    document.getElementById("counterList");

  const itemSelect =
    document.getElementById("itemSelect");

  const saveButton =
    document.getElementById("saveButton");

  const saveRecordButton =
    document.getElementById("saveRecordButton");

  const addNewItemButton =
    document.getElementById("addNewItemButton");

  const newItemId =
    document.getElementById("newItemId");

  const newItemName =
    document.getElementById("newItemName");

  const newItemType =
    document.getElementById("newItemType");


  // =====================================================
  // DATE
  // =====================================================

  const today =
    new Date().toISOString().split("T")[0];

  datePicker.value = today;


  // =====================================================
  // ALL ITEMS
  // =====================================================

  /*
    Format:

    [
      [ID, Name, Type],
      [ID, Name, Type]
    ]

    Type:
      p = Popular
      u = Unpopular
  */

  let allItems = [];


  // =====================================================
  // ACTIVE ITEMS
  // =====================================================

  /*
    IDs currently visible in the counter list.
  */

  let activeItems = new Set();


  // =====================================================
  // LOAD ITEMS
  // =====================================================

  async function loadItems() {

    try {

      console.log("Loading products...");

      const response =
        await fetch(
          GOOGLE_SCRIPT_URL +
          "?action=getItems"
        );


      if (!response.ok) {

        throw new Error(
          "Could not connect to Google Apps Script."
        );

      }


      const result =
        await response.json();


      console.log(
        "Google Apps Script response:",
        result
      );


      if (!result.success) {

        throw new Error(
          result.message ||
          "Could not load items."
        );

      }


      // -----------------------------------------------
      // Normalize items
      // -----------------------------------------------

      allItems =
        (result.items || []).map(item => {

          return [
            String(item[0]),
            String(item[1]),
            String(item[2]).toLowerCase()
          ];

        });


      console.log(
        "Items loaded:",
        allItems
      );


      // -----------------------------------------------
      // Build interface
      // -----------------------------------------------

      initializeItems();


    } catch (error) {

      console.error(
        "Could not load items:",
        error
      );


      alert(
        "Could not load products from Google Sheet.\n\n" +
        error.message
      );

    }

  }


  // =====================================================
  // INITIALIZE ITEMS
  // =====================================================

  function initializeItems() {

    // -----------------------------------------------
    // Reset active items
    // -----------------------------------------------

    activeItems =
      new Set(
        allItems
          .filter(item => item[2] === "p")
          .map(item => String(item[0]))
      );


    // -----------------------------------------------
    // Clear counter list
    // -----------------------------------------------

    counterList.innerHTML = "";


    // -----------------------------------------------
    // Show popular items
    // -----------------------------------------------

    allItems
      .filter(item => item[2] === "p")
      .forEach(item => {

        createCounterItem(item);

      });


    // -----------------------------------------------
    // Update dropdown
    // -----------------------------------------------

    updateDropdown();

  }


  // =====================================================
  // UPDATE DROPDOWN
  // =====================================================

  function updateDropdown() {

    itemSelect.innerHTML = `
      <option value="">
        Select an item...
      </option>
    `;


    allItems
      .filter(item => item[2] === "u")
      .forEach(item => {

        const id =
          String(item[0]);

        const name =
          item[1];


        // ---------------------------------------------
        // Only show items not already active
        // ---------------------------------------------

        if (!activeItems.has(id)) {

          const option =
            document.createElement("option");


          option.value =
            id;


          option.textContent =
            name;


          itemSelect.appendChild(
            option
          );

        }

      });

  }


  // =====================================================
  // ADD UNPOPULAR ITEM TO MAIN COUNTER
  // =====================================================

  itemSelect.addEventListener(
    "change",
    () => {

      const selectedId =
        String(itemSelect.value).trim();


      console.log(
        "Selected item ID:",
        selectedId
      );


      // ---------------------------------------------
      // Nothing selected
      // ---------------------------------------------

      if (!selectedId) {

        return;

      }


      // ---------------------------------------------
      // Find selected item
      //
      // IMPORTANT:
      // Both IDs are converted to String.
      // This fixes Google Sheet number/string mismatch.
      // ---------------------------------------------

      const selectedItem =
        allItems.find(
          item =>
            String(item[0]).trim() === selectedId
        );


      console.log(
        "Selected item:",
        selectedItem
      );


      // ---------------------------------------------
      // Item not found
      // ---------------------------------------------

      if (!selectedItem) {

        console.error(
          "Could not find selected item:",
          selectedId,
          allItems
        );

        alert(
          "Could not find the selected item."
        );

        return;

      }


      // ---------------------------------------------
      // Prevent duplicate
      // ---------------------------------------------

      if (activeItems.has(selectedId)) {

        itemSelect.value = "";

        return;

      }


      // ---------------------------------------------
      // Add to active items
      // ---------------------------------------------

      activeItems.add(
        selectedId
      );


      // ---------------------------------------------
      // Add item to main list
      // ---------------------------------------------

      createCounterItem(
        selectedItem
      );


      // ---------------------------------------------
      // Refresh dropdown
      // ---------------------------------------------

      updateDropdown();


      // Reset select
      itemSelect.value = "";

    }
  );


  // =====================================================
  // CREATE COUNTER ITEM
  // =====================================================

  function createCounterItem(item) {

    const id =
      String(item[0]);

    const name =
      String(item[1]);

    const type =
      String(item[2]);


    // -----------------------------------------------
    // Prevent duplicate visual item
    // -----------------------------------------------

    const existing =
      counterList.querySelector(
        `.counter-item[data-item-id="${CSS.escape(id)}"]`
      );


    if (existing) {

      return;

    }


    // -----------------------------------------------
    // Create element
    // -----------------------------------------------

    const counterItem =
      document.createElement("div");


    counterItem.className =
      "counter-item";


    counterItem.dataset.itemId =
      id;


    counterItem.innerHTML = `
      <span class="item-name">
        ${escapeHtml(name)}
      </span>

      <div class="controls">

        <button
          type="button"
          class="minus"
        >
          −
        </button>

        <span class="count">
          0
        </span>

        <button
          type="button"
          class="plus"
        >
          +
        </button>

      </div>
    `;


    // -----------------------------------------------
    // Get controls
    // -----------------------------------------------

    const minusButton =
      counterItem.querySelector(
        ".minus"
      );


    const plusButton =
      counterItem.querySelector(
        ".plus"
      );


    const countElement =
      counterItem.querySelector(
        ".count"
      );


    // -----------------------------------------------
    // PLUS
    // -----------------------------------------------

    plusButton.addEventListener(
      "click",
      () => {

        let count =
          Number(
            countElement.textContent
          );


        count++;


        countElement.textContent =
          count;

      }
    );


    // -----------------------------------------------
    // MINUS
    // -----------------------------------------------

    minusButton.addEventListener(
      "click",
      () => {

        let count =
          Number(
            countElement.textContent
          );


        if (count > 0) {

          count--;

        }


        countElement.textContent =
          count;

      }
    );


    // -----------------------------------------------
    // Add to main list
    // -----------------------------------------------

    counterList.appendChild(
      counterItem
    );


    console.log(
      "Counter item added:",
      id,
      name
    );

  }


  // =====================================================
  // HTML ESCAPE
  // =====================================================

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =====================================================
  // PACKAGING COUNTER
  // =====================================================

  const packagingItems =
    document.querySelectorAll(
      ".packaging-item"
    );


  packagingItems.forEach(
    item => {

      const minusButton =
        item.querySelector(
          ".pack-minus"
        );


      const plusButton =
        item.querySelector(
          ".pack-plus"
        );


      const countElement =
        item.querySelector(
          ".pack-count"
        );


      // -----------------------------------------------
      // PLUS
      // -----------------------------------------------

      plusButton.addEventListener(
        "click",
        () => {

          let count =
            Number(
              countElement.textContent
            );


          count++;


          countElement.textContent =
            count;

        }
      );


      // -----------------------------------------------
      // MINUS
      // -----------------------------------------------

      minusButton.addEventListener(
        "click",
        () => {

          let count =
            Number(
              countElement.textContent
            );


          if (count > 0) {

            count--;

          }


          countElement.textContent =
            count;

        }
      );

    }
  );


  // =====================================================
  // ADD NEW ITEM
  // =====================================================

  addNewItemButton.addEventListener(
    "click",
    async () => {

      const id =
        newItemId.value.trim();

      const name =
        newItemName.value.trim();

      const type =
        newItemType.value;


      // -----------------------------------------------
      // Validate ID
      // -----------------------------------------------

      if (!id) {

        alert(
          "Please enter an Item ID."
        );

        newItemId.focus();

        return;

      }


      // -----------------------------------------------
      // Validate name
      // -----------------------------------------------

      if (!name) {

        alert(
          "Please enter an Item Name."
        );

        newItemName.focus();

        return;

      }


      // -----------------------------------------------
      // Validate type
      // -----------------------------------------------

      if (
        type !== "p" &&
        type !== "u"
      ) {

        alert(
          "Please select an item type."
        );

        return;

      }


      // -----------------------------------------------
      // Check duplicate ID
      // -----------------------------------------------

      const existingId =
        allItems.some(
          item =>
            String(item[0]).trim() === id
        );


      if (existingId) {

        alert(
          "This Item ID already exists."
        );

        return;

      }


      // -----------------------------------------------
      // Check duplicate name
      // -----------------------------------------------

      const existingName =
        allItems.some(
          item =>
            String(item[1])
              .trim()
              .toLowerCase() ===
            name.toLowerCase()
        );


      if (existingName) {

        alert(
          "This item name already exists."
        );

        return;

      }


      // -----------------------------------------------
      // Disable button
      // -----------------------------------------------

      addNewItemButton.disabled =
        true;

      addNewItemButton.textContent =
        "Adding...";


      try {

        // ---------------------------------------------
        // Send to Google Apps Script
        // ---------------------------------------------

        const response =
          await fetch(
            GOOGLE_SCRIPT_URL,
            {
              method: "POST",

              body:
                JSON.stringify({

                  action:
                    "addItem",

                  id:
                    id,

                  name:
                    name,

                  type:
                    type

                })

            }
          );


        // ---------------------------------------------
        // Check HTTP response
        // ---------------------------------------------

        if (!response.ok) {

          throw new Error(
            "Could not connect to Google Apps Script."
          );

        }


        // ---------------------------------------------
        // Read response
        // ---------------------------------------------

        const result =
          await response.json();


        console.log(
          "Add item response:",
          result
        );


        // ---------------------------------------------
        // Check success
        // ---------------------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            "Could not add item."
          );

        }


        // ---------------------------------------------
        // Replace local items with returned list
        // ---------------------------------------------

        allItems =
          (result.items || []).map(item => {

            return [
              String(item[0]),
              String(item[1]),
              String(item[2]).toLowerCase()
            ];

          });


        // ---------------------------------------------
        // Rebuild interface
        // ---------------------------------------------

        initializeItems();


        // ---------------------------------------------
        // Clear form
        // ---------------------------------------------

        newItemId.value =
          "";

        newItemName.value =
          "";

        newItemType.value =
          "u";


        // ---------------------------------------------
        // Success
        // ---------------------------------------------

        addNewItemButton.textContent =
          "✓ Item Added";


        setTimeout(
          () => {

            addNewItemButton.textContent =
              "＋ Add New Item";

          },
          2000
        );


      } catch (error) {

        console.error(
          "Add item error:",
          error
        );


        alert(
          "Could not add item.\n\n" +
          error.message
        );


        addNewItemButton.textContent =
          "❌ Failed";


        setTimeout(
          () => {

            addNewItemButton.textContent =
              "＋ Add New Item";

          },
          2000
        );

      }


      addNewItemButton.disabled =
        false;

    }
  );


  // =====================================================
  // SAVE AS IMAGE
  // =====================================================

  saveButton.addEventListener(
    "click",
    async () => {

      saveButton.disabled =
        true;


      saveButton.textContent =
        "Creating image...";


      try {

        const result =
          document.getElementById(
            "result"
          );


        const canvas =
          await html2canvas(
            result,
            {

              backgroundColor:
                "#ffffff",

              scale:
                2,

              width:
                result.scrollWidth,

              height:
                result.scrollHeight

            }
          );


        const image =
          canvas.toDataURL(
            "image/png"
          );


        const link =
          document.createElement(
            "a"
          );


        link.download =
          `counter-${datePicker.value}.png`;


        link.href =
          image;


        link.click();


      } catch (error) {

        console.error(
          "Image error:",
          error
        );


        alert(
          "Could not create the image."
        );

      }


      saveButton.disabled =
        false;


      saveButton.textContent =
        "📷 Save as Image";

    }
  );


  // =====================================================
  // GET CURRENT RECORD
  // =====================================================

  function getCurrentRecord() {

    const selectedDate =
      datePicker.value;


    const now =
      new Date();


    const time =
      now.toLocaleTimeString(
        "en-GB",
        {
          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit"
        }
      );


    const timestamp =
      `${selectedDate} ${time}`;


    // =================================================
    // ITEM COUNTS
    // =================================================

    const itemCounts = {};


    // -----------------------------------------------
    // Start every item at 0
    // -----------------------------------------------

    allItems.forEach(
      item => {

        const id =
          String(item[0]);

        itemCounts[id] =
          0;

      }
    );


    // -----------------------------------------------
    // Read visible counters
    // -----------------------------------------------

    document
      .querySelectorAll(
        ".counter-item"
      )
      .forEach(
        item => {

          const id =
            String(
              item.dataset.itemId
            );


          const countElement =
            item.querySelector(
              ".count"
            );


          if (
            id &&
            countElement
          ) {

            itemCounts[id] =
              Number(
                countElement.textContent
              );

          }

        }
      );


    // =================================================
    // PACKAGING COUNTS
    // =================================================

    const packagingCounts =
      {};


    document
      .querySelectorAll(
        ".packaging-item"
      )
      .forEach(
        item => {

          const name =
            item
              .querySelector(
                "span"
              )
              .textContent
              .trim();


          const count =
            Number(
              item
                .querySelector(
                  ".pack-count"
                )
                .textContent
            );


          packagingCounts[name] =
            count;

        }
      );


    // =================================================
    // COMMENT
    // =================================================

    const comment =
      document
        .getElementById(
          "comment"
        )
        .value
        .trim();


    // =================================================
    // RETURN RECORD
    // =================================================

    return {

      action:
        "saveRecord",

      timestamp:
        timestamp,

      date:
        selectedDate,

      time:
        time,

      itemCounts:
        itemCounts,

      itemNames:
        getItemNames(),

      packagingCounts:
        packagingCounts,

      comment:
        comment

    };

  }


  // =====================================================
  // GET ITEM NAMES
  // =====================================================

  function getItemNames() {

    const itemNames =
      {};


    allItems.forEach(
      item => {

        const id =
          String(item[0]);

        const name =
          String(item[1]);


        itemNames[id] =
          name;

      }
    );


    return itemNames;

  }


  // =====================================================
  // SAVE TO GOOGLE SHEET
  // =====================================================

  saveRecordButton.addEventListener(
    "click",
    async () => {

      saveRecordButton.disabled =
        true;


      saveRecordButton.textContent =
        "Saving...";


      try {

        // ---------------------------------------------
        // Build record
        // ---------------------------------------------

        const record =
          getCurrentRecord();


        console.log(
          "Sending record:",
          record
        );


        // ---------------------------------------------
        // Send to Apps Script
        // ---------------------------------------------

        const response =
          await fetch(
            GOOGLE_SCRIPT_URL,
            {

              method:
                "POST",

              redirect:
                "follow",

              body:
                JSON.stringify(
                  record
                )

            }
          );


        // ---------------------------------------------
        // Check HTTP response
        // ---------------------------------------------

        if (!response.ok) {

          throw new Error(
            "Could not connect to Google Apps Script."
          );

        }


        // ---------------------------------------------
        // Read response
        // ---------------------------------------------

        const result =
          await response.json();


        console.log(
          "Google response:",
          result
        );


        // ---------------------------------------------
        // Check success
        // ---------------------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            "Google Sheet rejected the record."
          );

        }


        // ---------------------------------------------
        // Success
        // ---------------------------------------------

        saveRecordButton.textContent =
          "✓ Saved to Google Sheet";


        setTimeout(
          () => {

            saveRecordButton.textContent =
              "💾 Save to Record";

          },
          2000
        );


      } catch (error) {

        console.error(
          "Save error:",
          error
        );


        alert(
          "Could not save the record.\n\n" +
          error.message
        );


        saveRecordButton.textContent =
          "❌ Save Failed";


        setTimeout(
          () => {

            saveRecordButton.textContent =
              "💾 Save to Record";

          },
          2000
        );

      }


      saveRecordButton.disabled =
        false;

    }
  );


  // =====================================================
  // START APPLICATION
  // =====================================================

  /*
    IMPORTANT:
    loadItems() is called ONLY ONCE here.
  */

  loadItems();

</script>
