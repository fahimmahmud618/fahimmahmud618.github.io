<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
 <body>

  <!-- =====================================================
       MAIN PAGE
  ====================================================== -->

  <div id="mainPage">

    <!-- Everything inside #result is saved as an image -->

    <div class="container" id="result">

      <h1>Mehwish Product Counter</h1>


      <!-- =========================
           DATE
      ========================== -->

      <div class="date-section">

        <label for="datePicker">
          Date
        </label>

        <input
          type="date"
          id="datePicker"
        >

      </div>


      <!-- =========================
           COUNTERS
      ========================== -->

      <div class="counter-layout">

        <!-- ITEM COUNTER -->

        <div class="item-counter-section">

          <div
            id="counterList"
            class="counter-list"
          ></div>

        </div>


        <!-- PACKAGING COUNTER -->

        <div class="packaging-section">

          <div class="packaging-title">
            Packaging
          </div>

          <div class="packaging-list">


            <!-- S -->

            <div class="packaging-item">

              <span>S</span>

              <div class="packaging-controls">

                <button
                  type="button"
                  class="pack-minus"
                >
                  −
                </button>

                <strong class="pack-count">
                  0
                </strong>

                <button
                  type="button"
                  class="pack-plus"
                >
                  +
                </button>

              </div>

            </div>


            <!-- M -->

            <div class="packaging-item">

              <span>M</span>

              <div class="packaging-controls">

                <button
                  type="button"
                  class="pack-minus"
                >
                  −
                </button>

                <strong class="pack-count">
                  0
                </strong>

                <button
                  type="button"
                  class="pack-plus"
                >
                  +
                </button>

              </div>

            </div>


            <!-- L -->

            <div class="packaging-item">

              <span>L</span>

              <div class="packaging-controls">

                <button
                  type="button"
                  class="pack-minus"
                >
                  −
                </button>

                <strong class="pack-count">
                  0
                </strong>

                <button
                  type="button"
                  class="pack-plus"
                >
                  +
                </button>

              </div>

            </div>


            <!-- XL -->

            <div class="packaging-item">

              <span>XL</span>

              <div class="packaging-controls">

                <button
                  type="button"
                  class="pack-minus"
                >
                  −
                </button>

                <strong class="pack-count">
                  0
                </strong>

                <button
                  type="button"
                  class="pack-plus"
                >
                  +
                </button>

              </div>

            </div>


          </div>

        </div>

      </div>


      <!-- =========================
           ADD UNPOPULAR ITEM
      ========================== -->

      <div
        class="add-section"
        id="addSection"
      >

        <label for="itemSelect">
          Add another item
        </label>

        <select id="itemSelect">

          <option value="">
            Select an item...
          </option>

        </select>

      </div>


      <!-- =========================
           COMMENT
      ========================== -->

      <div class="comment-section">

        <label for="comment">
          Comment / Additional Item
        </label>

        <textarea
          id="comment"
          placeholder="Write a comment or add another item..."
          rows="3"
        ></textarea>

      </div>


    </div>


    <!-- =================================================
         SAVE AS IMAGE
    ================================================== -->

    <div class="save-section">

      <button
        type="button"
        class="save-button"
        id="saveButton"
      >
        📷 Save as Image
      </button>

    </div>


    <!-- =================================================
         SAVE TO RECORD
    ================================================== -->

    <div class="save-section">

      <button
        type="button"
        class="save-button"
        id="saveRecordButton"
      >
        💾 Save to Record
      </button>

    </div>


    <!-- =================================================
         ADD NEW PRODUCT
    ================================================== -->

    <div class="new-item-section">

      <h3>
        Add New Product
      </h3>


      <input
        type="text"
        id="newItemId"
        placeholder="Item ID e.g. 0025"
      >


      <input
        type="text"
        id="newItemName"
        placeholder="Item name e.g. New Product"
      >


      <select id="newItemType">

        <option value="p">
          Popular
        </option>

        <option value="u">
          Unpopular
        </option>

      </select>


      <button
        type="button"
        id="addNewItemButton"
      >
        ＋ Add New Item
      </button>

    </div>


    <!-- =================================================
         VIEW GOOGLE SHEET
    ================================================== -->

    <div class="sheet-section">

      <button
        type="button"
        class="sheet-button"
        id="viewSheetButton"
      >
        📊 View Current Database
      </button>

    </div>


    <!-- =================================================
         ADD TO STOCK
    ================================================== -->

    <div class="sheet-section">

      <button
        type="button"
        class="sheet-button"
        id="addToStockButton"
      >
        📦 ADD to Stock
      </button>

    </div>

    <!-- ================================
        SEE STOCK UPDATE
    ================================ -->

    <div class="sheet-section">

    <button
        type="button"
        class="sheet-button"
        id="seeStockButton"
    >
        📦 SEE STOCK UPDATE
    </button>

    </div>


  </div>


  <!-- =====================================================
       ADD TO STOCK PAGE
  ====================================================== -->

  <!-- =====================================================
     ADD TO STOCK PAGE
===================================================== -->

<div
  id="stockPage"
  class="stock-page"
  style="display: none;"
>

  <h1>Add to Stock</h1>


  <!-- DATE -->

  <div class="date-section">

    <label for="stockDate">
      Date
    </label>

    <input
      type="date"
      id="stockDate"
    >

  </div>


  <!-- =================================================
       PRODUCT STOCK
  ================================================== -->

  <div class="stock-section">

    <div class="stock-section-title">
      Products
    </div>


    <div
      id="stockList"
      class="stock-list"
    ></div>

  </div>


  <!-- =================================================
       PACKAGING STOCK
  ================================================== -->

  <div class="stock-packaging-section">

    <div class="stock-section-title">
      Packaging
    </div>


    <div class="stock-packaging-list">


      <!-- S -->

      <div class="stock-packaging-item">

        <span>S</span>

        <input
          type="number"
          class="stock-packaging-input"
          data-packaging="S"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="0"
        >

      </div>


      <!-- M -->

      <div class="stock-packaging-item">

        <span>M</span>

        <input
          type="number"
          class="stock-packaging-input"
          data-packaging="M"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="0"
        >

      </div>


      <!-- L -->

      <div class="stock-packaging-item">

        <span>L</span>

        <input
          type="number"
          class="stock-packaging-input"
          data-packaging="L"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="0"
        >

      </div>


      <!-- XL -->

      <div class="stock-packaging-item">

        <span>XL</span>

        <input
          type="number"
          class="stock-packaging-input"
          data-packaging="XL"
          min="0"
          step="1"
          inputmode="numeric"
          placeholder="0"
        >

      </div>


    </div>

  </div>


  <!-- =================================================
       SAVE STOCK
  ================================================== -->

  <div class="stock-button-section">

    <button
      type="button"
      id="saveStockButton"
      class="stock-save-button"
    >
      💾 Save Stock
    </button>

  </div>


  <!-- =================================================
       BACK
  ================================================== -->

  <div class="stock-button-section">

    <button
      type="button"
      id="backToCounterButton"
      class="stock-back-button"
    >
      ← Back to Counter
    </button>

  </div>

</div>

<script src="script.js"></script>
</body>   
</html>
