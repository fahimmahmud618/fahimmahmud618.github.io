<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stock Update</title>

  <link
    rel="stylesheet"
    href="stock.css"
  >

</head>


<body>

  <div class="container">

    <!-- ================================
         HEADER
    ================================= -->

    <div class="header">

      <h1>
        Stock Update
      </h1>

      <div
        id="sheetName"
        class="sheet-name"
      >
        Loading...
      </div>

    </div>


    <!-- ================================
         PRODUCTS
    ================================= -->

    <div class="section">

      <h2>
        Products
      </h2>

      <div
        id="stockList"
        class="stock-list"
      >

        <div class="loading">
          Loading stock...
        </div>

      </div>

    </div>


    <!-- ================================
         PACKAGING
    ================================= -->

    <div class="section">

      <h2>
        Packaging
      </h2>

      <div
        id="packagingList"
        class="stock-list"
      >

        <div class="loading">
          Loading packaging...
        </div>

      </div>

    </div>


    <!-- ================================
         BACK BUTTON
    ================================= -->

    <button
      type="button"
      id="backButton"
      class="back-button"
    >
      ← Back
    </button>

  </div>


  <script src="stock.js"></script>

</body>

</html>
